<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline so it needs no static route: run.py only mounts /assets, so a file in
         public/ would 404 in production — which is what /favicon.ico was doing. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230072F5'/><path d='M9 16.5 13.5 21 23 11' fill='none' stroke='%23ffffff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>Check-in Panel | 自动签到管理面板</title>
    <!-- 亮暗主题：必须在样式生效前定下 <html class="dark">，放到 React 里做会先渲染一帧亮色。
         存的可能是 light / dark / system 三种；**值不是 light 或 dark 就跟系统**（包括存过
         `system` 和从没存过两种情况，见 src/theme.ts 的约定）。 -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('checkin-theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (t === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
